# Глобальный переключатель, включает запуск тестов, если тут стоит false, то остальные настройки не будут работать
junit.jupiter.execution.parallel.enabled=true

# Настройка логики запуска внутри класса:
# Для аннотации UsePlaywright тут рекомендуется настройка same_thread:
junit.jupiter.execution.parallel.mode.default=same_thread
# Настройка запуска:
# Для аннотации UsePlaywright тут рекомендуется настройка concurrent:
junit.jupiter.execution.parallel.mode.classes.default=concurrent
# Разные классы должны работать через разные экземпляры, но методы внутри одного класса идут по очереди один за другим

# Настройка вывода
# verbose выводит лог событий для того, что выполнялось
junit.jupiter.execution.parallel.console.mode=verbose

# Параметры влияют на то, сколько потоков (процессов) выполняют тесты.
# Fixed — число потоков, которое указано в fixed.parallelism
# Dynamic — JUnit вычисляет количество ядер и умножает на фактор в dynamic.factor
# В зависимости от того, что указано в strategy, будет либо config.fixed.parallelism, либо config.dynamic.factor, но не оба
junit.jupiter.execution.parallel.config.strategy=fixed
#junit.jupiter.execution.parallel.config.dynamic.factor=4
junit.jupiter.execution.parallel.config.fixed.parallelism=4

# Есть два режима: same_thread (последовательно) и concurrent (параллельно).
# concurrent = позволяет запускать методы внутри класса или разные классы одновременно в разных потоках
# same_thread = не дает коду в этом контексте выполняться на других потоках, заставляя тесты внутри класса идти по очереди один за другим

cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
# Этот параметр настраивает лимит ресурсов под капотом Java (ForkJoinPool).
# Если ты укажешь только parallelism=4, но не ограничишь max-pool-size, система в критический момент может кратковременно создать 5-й или 6-й поток, чтобы "протолкнуть" очередь.
cucumber.execution.parallel.config.fixed.max-pool-size=4
