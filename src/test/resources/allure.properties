allure.results.directory=target/allure-results

# Эти "результаты теста" (результаты) формируются из JSON-файлов. Сами по себе они не открываются в IDEA, нужен отчет (который мы генерируем с помощью команды allure serve)
# Важно не перепутать эти две папки. Папка results формируется всегда, пока есть:
# Либо через консольную команду allure serve target/allure-results.
# Либо, если мы используем команду allure generate, создается папка allure-report.

# Важный нюанс: если вы хотите, чтобы в отчете была видна история предыдущих запусков, нужно перед запуском копировать категорию history из старой папки target.
# Обычно история не сохраняется командой clean (в mvn clean test). Эта команда удаляет результаты, чтобы они не перемешивались в отчете.

#mvn clean verify -Dtest="com.kroenner.playwright.toolshopNoUsePlaywright.**" - прогнать тесты и сгенерировать отчет только по тестам из конкретной папки
#mvn clean verify -Dtest="com.kroenner.playwright.toolshopUsePlaywright.**"
#mvn io.qameta.allure:allure-maven:serve - открыть локально отчет